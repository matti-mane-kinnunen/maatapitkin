<title>Maata pitkin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: departure-board list of capitals on the left, overland map on the right,
   itinerary for the selected capital below the map. */
:root {
  --bg: #eef1f0; --panel: #f9fbfa; --fg: #16212a; --muted: #5d6b73; --rule: #cfd8d8;
  --sea: #dfe8ec; --land: #fbfcfb; --border: #b9c6ca;
  --train: #2f4a63; --night: #0b8f9b; --ferry: #3d6fa8; --accent: #d9581f; --warn: #a86a00;
  --missing: #9aa7ad;
  /* arrival day of a capital: one hue, light (day 1) to dark (day 6+); validated ordinal ramp */
  --day1: #86b6ef; --day2: #5598e7; --day3: #2a78d6; --day4: #1c5cab; --day5: #104281; --day6: #0b2a52;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f161b; --panel: #151e24; --fg: #e3eaec; --muted: #93a3aa; --rule: #26333b;
  --sea: #0c1317; --land: #1a242b; --border: #2e3d46;
  --train: #9db7cc; --night: #35c3cf; --ferry: #79a7dc; --accent: #ff7a3d; --warn: #e3a63b;
  --missing: #5e6d74; --day1: #1c5cab; --day2: #2a78d6; --day3: #5598e7; --day4: #86b6ef; --day5: #b7d3f6; --day6: #e3effc; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f161b; --panel: #151e24; --fg: #e3eaec; --muted: #93a3aa; --rule: #26333b;
  --sea: #0c1317; --land: #1a242b; --border: #2e3d46;
  --train: #9db7cc; --night: #35c3cf; --ferry: #79a7dc; --accent: #ff7a3d; --warn: #e3a63b;
  --missing: #5e6d74; --day1: #1c5cab; --day2: #2a78d6; --day3: #5598e7; --day4: #86b6ef; --day5: #b7d3f6; --day6: #e3effc; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px; }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 20px }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px;
  border-bottom: 2px solid var(--fg); padding-bottom: 10px }
h1 { font: 700 clamp(2rem, 5vw, 3.2rem)/0.95 var(--display); letter-spacing: 0.01em; margin: 0; text-transform: uppercase }
h1 small { display: block; font: 500 1rem/1.3 var(--body); text-transform: none; color: var(--muted); margin-top: 6px; letter-spacing: 0 }
.meta { font: 400 12px/1.5 var(--mono); color: var(--muted); text-align: right }
.grid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr) } .board { order: 2 } .meta { text-align: left } }

/* Departure board */
.board { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden }
.board h2, .itin h2 { font: 600 13px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between }
.board ol { list-style: none; margin: 0; padding: 0 }
.board button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid;
  grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule) }
.board button:hover { background: color-mix(in srgb, var(--accent) 7%, transparent) }
.board button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.board button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: inset 3px 0 0 var(--accent) }
.cap { font: 600 1.15rem/1.2 var(--display); letter-spacing: 0.02em }
.cap .w { color: var(--warn); font-size: 0.9rem; margin-left: 4px }
.when { font: 500 13px/1.6 var(--mono); font-variant-numeric: tabular-nums; text-align: right }
.bar { grid-column: 1 / -1; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--train) }
button[aria-pressed="true"] .bar i { background: var(--accent) }
.sub { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.gaps { padding: 12px 14px; font-size: 13px; color: var(--muted) }
/* search and filters above the arrivals list */
.tools { display: grid; gap: 8px; padding: 10px 14px 12px; border-bottom: 1px solid var(--rule) }
.tools input[type=search] { width: 100%; box-sizing: border-box; font: 14px var(--body); color: var(--fg); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 4px; padding: 7px 10px }
.tools input[type=search]:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--muted) }
.seg > span { margin-right: 4px }
.seg button { all: unset; cursor: pointer; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 999px; font-size: 12px; color: var(--fg) }
.seg button:hover { border-color: var(--accent) }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg) }
.togs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg) }
.togs label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer }
.togs input { accent-color: var(--accent); margin: 0 }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.board .citytag { font: 500 10px var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-left: 6px; vertical-align: 2px }
.board li.empty { padding: 14px; font-size: 13px; color: var(--muted) }
.board li.noroute { padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 12px; color: var(--muted) }
.board li.noroute b { font: 600 1.05rem/1.2 var(--display); color: var(--fg); letter-spacing: 0.02em; display: block }
.board li.empty button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; margin-left: 4px }
#nodes .dim, #labels .dim { opacity: 0.22 }
.gaps b { color: var(--fg); font-weight: 600 }

/* Map */
.mapcol { display: grid; gap: 14px; min-width: 0 }
.mapbox { background: var(--sea); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; position: relative }
svg { display: block; width: 100%; height: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none }
#map.zoomed { cursor: grab } #map.panning, #map.panning .hit.go { cursor: grabbing }
/* lines and outlines keep their width on screen when zoomed */
#land path, .leg, .halo, .node, .hit, .leghit { vector-effect: non-scaling-stroke }
#land, #base, #preview, #route, #nodes { pointer-events: none }
/* an invisible wide strip along each line, so a thin line is easy to hover or tap */
.leghit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: help }
#base .leg.hot { stroke-width: 3.2; opacity: 1 }
.tip .svcs { display: grid; gap: 6px; margin-top: 4px }
.tip .svc-row b { font: 600 12px var(--body); display: inline; letter-spacing: 0 }
.tip .times { font: 11px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; word-spacing: 2px }
.tip .chipnote { font-size: 11px; color: var(--night) }
.tip hr.tipsep { border: 0; border-top: 1px solid var(--rule); margin: 8px 0 }
.zoombar { position: absolute; z-index: 3; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px }
.zoombar button { all: unset; box-sizing: border-box; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer;
  background: var(--panel); color: var(--fg); border: 1px solid var(--rule); border-radius: 4px;
  font: 600 18px/1 var(--body); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12) }
.zoombar button.fit { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase }
.zoombar button:hover { border-color: var(--accent) }
.zoombar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.zoombar button:disabled { opacity: 0.4; cursor: default; border-color: var(--rule) }
#land path { fill: var(--land); stroke: var(--border); stroke-width: 0.6 }
.leg { fill: none; stroke-linecap: round }
.leg.train { stroke: var(--train) } .leg.night { stroke: var(--night) } .leg.ferry, .leg.local { stroke: var(--ferry); stroke-dasharray: 4 4 }
#base .leg { stroke-width: 1.3; opacity: 0.45 }
#route .leg { stroke-width: 4.2; opacity: 1 }
#route .leg.ferry, #route .leg.local { stroke-dasharray: 7 6 }
#route .halo { fill: none; stroke: var(--land); stroke-width: 8; stroke-linecap: round; opacity: 0.9 }
.node { fill: var(--panel); stroke: var(--fg); stroke-width: 1.2 }
.node.capital { fill: var(--fg) }
.d1 { --day: var(--day1) } .d2 { --day: var(--day2) } .d3 { --day: var(--day3) }
.d4 { --day: var(--day4) } .d5 { --day: var(--day5) } .d6 { --day: var(--day6) }
.node.capital.day { fill: var(--day); stroke: var(--fg); stroke-width: 1 }
.swatch { display: inline-block; width: 0.7em; height: 0.7em; border: 1px solid var(--fg); background: var(--day); vertical-align: 0.05em; margin-right: 6px }
.daylegend { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px }
.daylegend b { font-weight: 500; color: var(--fg) }
.node.missing { fill: none; stroke: var(--missing); stroke-dasharray: 2 2 }
.node.on { stroke: var(--accent); stroke-width: 2.4 }
#nodes .node.target { fill: var(--accent); stroke: var(--accent) }
.hit { fill: transparent; stroke: none }
.hit.go { cursor: pointer }
.hit.go:hover, .hit.go:focus-visible { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: var(--accent); stroke-width: 1.5; outline: none }
#preview .leg { stroke: var(--accent); stroke-width: 3; opacity: 0.55; stroke-dasharray: none }
.tip { position: absolute; z-index: 2; pointer-events: none; max-width: 17rem; padding: 7px 10px; border-radius: 5px;
  background: var(--panel); color: var(--fg); border: 1px solid var(--rule); box-shadow: 0 4px 14px rgb(0 0 0 / 0.14);
  font-size: 12px; line-height: 1.45 }
.tip b { font: 600 15px/1.2 var(--display); letter-spacing: 0.02em; display: block }
.tip .t { font-family: var(--mono); font-variant-numeric: tabular-nums }
.tip .hint { color: var(--muted) }
/* labels keep their size on screen when zoomed (--z is the zoom factor) */
.lbl { font-family: var(--display); font-weight: 600; font-size: calc(11px / var(--z, 1)); letter-spacing: 0.03em; fill: var(--fg);
  paint-order: stroke; stroke: var(--land); stroke-width: calc(3px / var(--z, 1)); stroke-linejoin: round; cursor: pointer }
.lbl.small { font-weight: 500; fill: var(--muted); font-size: calc(10px / var(--z, 1)) }
.lbl.missing { fill: var(--missing); font-weight: 500 }
.lbl.target { fill: var(--accent); font-weight: 700 }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); padding: 0 2px }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend svg { width: 28px; height: 10px }

/* Itinerary */
.itin { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px }
.itin h2 span:last-child { font-family: var(--mono); letter-spacing: 0; text-transform: none; font-size: 12px }
.steps { list-style: none; margin: 0; padding: 4px 0 }
.opts { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 6px }
.opts:empty { display: none }
.opts button { all: unset; cursor: pointer; border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px;
  display: grid; gap: 1px; min-width: 9rem }
.opts button b { font: 600 12px/1.2 var(--body); letter-spacing: 0.04em; text-transform: uppercase }
.opts button span { font: 12px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.opts button:hover { border-color: var(--accent) }
.opts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.opts button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent) }
.alt { color: var(--accent) }
.steps li { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 4px 16px; padding: 8px 14px; border-bottom: 1px dashed var(--rule) }
.steps li:last-child { border-bottom: 0 }
@media (max-width: 520px) { .steps li { grid-template-columns: minmax(0, 1fr) } }
.t { font: 13px/1.5 var(--mono); font-variant-numeric: tabular-nums }
.t em { font-style: normal; color: var(--muted) }
.what { min-width: 0 }
.what b { font-weight: 600 }
.chip { display: inline-block; font: 600 10px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 6px;
  border-radius: 3px; margin-left: 6px; vertical-align: 2px; border: 1px solid currentColor }
.chip.night { color: var(--night) } .chip.ferry, .chip.local { color: var(--ferry) }
.svc { color: var(--muted); font-size: 13px }
.issue { color: var(--warn); font-size: 13px }
.wait { color: var(--muted); font-size: 13px; font-style: italic }
.steps li.pause { padding-block: 4px }
.steps li.stay { background: color-mix(in srgb, var(--warn) 9%, transparent) }
.steps li.dayhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; border-bottom: 0;
  font: 600 12px/1 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted) }
.steps li.dayhead:first-child { padding-top: 8px }
.steps li.dayhead .swatch { margin: 0 }
/* marks on the selected journey: day boundaries and hotel nights (drawn at screen size) */
.mark rect { fill: var(--panel); stroke-width: 2; vector-effect: non-scaling-stroke }
.mark.day rect { stroke: var(--day) }
.mark.day text { font: 700 10px var(--body); fill: var(--fg); text-anchor: middle; dominant-baseline: central }
.mark.hotel rect { stroke: var(--warn) }
.mark path { fill: none; stroke: var(--fg); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round }
.chip.hotel { color: var(--warn) }
.bed { color: var(--warn) }
footer { font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px }
@media (prefers-reduced-motion: no-preference) { #route .leg { transition: opacity .2s } }
</style>

<div class="wrap">
  <header>
    <h1>Maata pitkin<small>Helsinki to European capitals by train and ferry — fastest connection from the timetable data</small></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="grid">
    <aside class="board" aria-label="Capitals by arrival time">
      <h2><span>Arrivals from Helsinki</span><span>door to door</span></h2>
      <div class="tools">
        <input type="search" id="q" placeholder="Find a city (press / )" aria-label="Find a destination" autocomplete="off" spellcheck="false">
        <div class="seg" id="f-day" role="group" aria-label="Arrive by"><span>Arrive by</span></div>
        <div class="togs">
          <label><input type="checkbox" id="f-nohotel"> No hotel nights</label>
          <label><input type="checkbox" id="f-cities"> Include other cities</label>
        </div>
        <div class="count" id="count" aria-live="polite"></div>
      </div>
      <ol id="list"></ol>
      <div class="gaps" id="gaps"></div>
    </aside>
    <div class="mapcol">
      <div class="mapbox">

  const nz = Math.min(ZMAX, Math.max(1, Z * factor));
  if (Math.abs(nz - Z) < 1e-4) return;
  const r = svgEl.getBoundingClientRect();
  if (cx == null) { cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
  const fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
  const mx = viewX + fx * W0 / Z, my = viewY + fy * H0 / Z;      // the map point under the pointer stays put
  Z = nz;
  viewX = mx - fx * W0 / Z; viewY = my - fy * H0 / Z;
  unhover(); applyView(true);
}
zoomIn.addEventListener("click", () => zoomAt(2));
zoomOut.addEventListener("click", () => zoomAt(0.5));
zoomFit.addEventListener("click", () => { Z = 1; viewX = viewY = 0; unhover(); applyView(true); });
svgEl.addEventListener("wheel", e => {
  if (!e.ctrlKey && e.deltaY > 0 && Z <= 1.001) return;          // nothing to zoom out: let the page scroll
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
}, { passive: false });
svgEl.addEventListener("dblclick", e => { e.preventDefault(); zoomAt(2, e.clientX, e.clientY); });
const pointers = new Map();
let drag = null, pinch = null, moved = false;
svgEl.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, vx: viewX, vy: viewY };
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: Z }; drag = null;
  }
});
window.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    zoomAt(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d / Z, (a.x + b.x) / 2, (a.y + b.y) / 2);
    moved = true; return;
  }
  if (!drag || Z <= 1.001) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 4) return;                 // a click, not a drag (yet)
  moved = true;
  const r = svgEl.getBoundingClientRect();
  viewX = drag.vx - dx / r.width * W0 / Z; viewY = drag.vy - dy / r.height * H0 / Z;
  svgEl.classList.add("panning"); unhover(); applyView(false);
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) { drag = null; svgEl.classList.remove("panning"); }
};
window.addEventListener("pointerup", endPointer);
window.addEventListener("pointercancel", endPointer);
svgEl.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
svgEl.addEventListener("click", e => { if (hotPairs.length && !e.target.classList.contains("leghit")) unhover(); });   // tap elsewhere closes the box
applyView(false);

// label widths change once the web fonts arrive: lay out again
document.fonts?.ready.then(() => { drawMarks(); layoutMain(); layoutCities(); placeHits(); });
</script>
