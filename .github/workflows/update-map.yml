# Weekly: look up next week's trains in Transitous, rebuild the map, check it, publish it.
# Also runs when pairs.txt changes (only the new lines are looked up) and by hand
# (Actions → Update map → Run workflow).
name: Update map

on:
  schedule:
    - cron: "0 1 * * 1"          # Mondays 01:00 UTC = 03:00 in Finland in winter (04:00 in summer)
  push:
    branches: [main]
    paths: [pairs.txt]
  workflow_dispatch:
    inputs:
      full:
        description: "Look up all lines again (not only new ones)"
        type: boolean
        default: true
      force:
        description: "Publish even if the check finds problems"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Next week's travel dates (Tue, Fri, Sat, Sun)
        id: dates
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import datetime as d
          t = d.date.today()
          tue = t + d.timedelta(days=7 - t.weekday() + 1)        # Tuesday of next week
          print(f"tue={tue}")
          print("dates=" + ",".join(str(tue + d.timedelta(days=k)) for k in (0, 3, 4, 5)))
          EOF

      # Full runs go oldest first and stop starting new lines after 240 minutes, so the job always
      # ends well inside GitHub's 6-hour limit. Lines not reached keep last week's data and come
      # first next time, so as the network grows every line is still refreshed every week or two.
      - name: Look up trains in Transitous
        run: |
          mode="--new"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then mode="--oldest-first"; fi
          python3 add_leg.py --file pairs.txt $mode --budget 240 --date "${{ steps.dates.outputs.tue }}" --days tue,fri,sat,sun 2>&1 | tee lookup.log

      - name: Build the map
        run: python3 build.py "date=${{ steps.dates.outputs.tue }}" "dates=${{ steps.dates.outputs.dates }}" | tee build.log

      - name: Check before publishing
        id: check
        run: |
          if python3 check_build.py > check.md; then echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "_Published anyway (force)._" >> check.md
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          cat check.md >> "$GITHUB_STEP_SUMMARY"
          { echo; echo "## Lookup"; echo '```'; sed -n '/^=====/,$p' lookup.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the new timetable data
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name "maatapitkin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ out/summary.json out/routes*.md
          git commit -m "Weekly update: trains for the week of ${{ steps.dates.outputs.tue }}" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Prepare the web page
        if: steps.check.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/site

      # Only what needs a person (lines that lost their trains, impossibly fast legs, new places,
      # guessed names) - opened as an issue, so GitHub emails it. A quiet week sends nothing (D-38).
      - name: Report lookup results that need attention
        if: always() && hashFiles('lookup.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 lookup_report.py lookup.log > attention.md
          if [ -s attention.md ]; then
            {
              echo "Timetable lookup for the week of ${{ steps.dates.outputs.tue }}. Map published: ${{ steps.check.outputs.ok == 'true' && 'yes' || 'no (see the held-back issue)' }}."
              echo
              cat attention.md
              echo
              echo "Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > issue.md
            { echo "## Needs attention"; echo; cat attention.md; } >> "$GITHUB_STEP_SUMMARY"
            gh issue create --title "Check the timetable lookup (week of ${{ steps.dates.outputs.tue }})" --body-file issue.md
          else
            echo "Nothing needs attention." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report a held-back update
        if: steps.check.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Map update held back (week of ${{ steps.dates.outputs.tue }})" --body-file check.md

  publish:
    needs: update
    if: needs.update.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
