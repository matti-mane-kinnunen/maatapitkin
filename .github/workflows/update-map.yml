# Weekly: look up next week's trains in Transitous, rebuild the map, check it, publish it.
# Also runs when pairs.txt changes (only the new lines are looked up) and by hand
# (Actions → Update map → Run workflow).
name: Update map

on:
  schedule:
    - cron: "0 1 * * 1"          # Mondays 01:00 UTC = 03:00 in Finland in winter (04:00 in summer)
  push:
    branches: [main]
    paths: [pairs.txt]
  workflow_dispatch:
    inputs:
      full:
        description: "Look up all lines again (not only new ones)"
        type: boolean
        default: true
      force:
        description: "Publish even if the check finds problems"
        type: boolean
        default: false

# Four jobs (FIX-17): look up -> build and check each map in a job of its own, side by side ->
# join, commit and report -> deploy. The US map (D-67) has a job of its own next to the lookup:
# it needs no Transitous lookup, only Amtrak's and Flix's own GTFS feeds. Only the last two may write; the lookup and the map jobs
# can only read the repository, so a build or a check can never change it or the site.
permissions:
  contents: read

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      tue: ${{ steps.dates.outputs.tue }}
      dates: ${{ steps.dates.outputs.dates }}
      origins: ${{ steps.origins.outputs.origins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Test the routing rules (FIX-15)
        run: python3 -m unittest discover -s tests -v

      - name: Next week's travel dates (Tue, Fri, Sat, Sun)
        id: dates
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import datetime as d
          t = d.date.today()
          tue = t + d.timedelta(days=7 - t.weekday() + 1)        # Tuesday of next week
          print(f"tue={tue}")
          print("dates=" + ",".join(str(tue + d.timedelta(days=k)) for k in (0, 3, 4, 5)))
          PY

      # one map job per origin in places.yaml, so a new map needs no change here
      - name: The maps to build
        id: origins
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, yaml
          print("origins=" + json.dumps(list(yaml.safe_load(open("data/places.yaml"))["settings"]["origins"])))
          PY

      # Full runs go oldest first and stop starting new lines after 240 minutes, so the job always
      # ends well inside GitHub's 6-hour limit. Lines not reached keep last week's data and come
      # first next time, so as the network grows every line is still refreshed every week or two.
      - name: Look up trains in Transitous
        run: |
          mode="--new"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then mode="--oldest-first"; fi
          python3 add_leg.py --file pairs.txt $mode --budget 240 --date "${{ steps.dates.outputs.tue }}" --days tue,fri,sat,sun 2>&1 | tee lookup.log

      # entries whose pairs.txt line is gone (or old trains a '*' line now covers) are removed
      # automatically - no judgement needed; the issue lists them (D-35)
      - name: Tidy legs.yaml
        run: python3 tidy_legs.py --apply | tee tidy.log

      # city texts (IDEA-22): texts not checked for four weeks, so about a quarter each week; new places
      # get their Wikidata item first. A failure keeps last week's texts and never stops the update.
      - name: Fetch city texts from Wikivoyage / Wikipedia
        continue-on-error: true
        timeout-minutes: 40
        run: python3 fetch_wiki.py --max-age 28 --pause 0.3 | tee wiki.log

      # the looked-up data goes to the map jobs and to the commit at the end - nothing is committed
      # until every map has been built and checked
      - name: Hand the data to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data
          retention-days: 7
          if-no-files-found: error
          path: |
            data/
            lookup.log
            tidy.log
            wiki.log

  map:
    needs: lookup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: map (${{ matrix.origin }})
    strategy:
      fail-fast: false              # one broken map must not stop the others; the publish job decides
      matrix:
        origin: ${{ fromJSON(needs.lookup.outputs.origins) }}
    env:
      ORIGIN: ${{ matrix.origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: .

      - run: pip install pyyaml playwright==1.63.0

      # one map; its four travel days are worked out side by side on the runner's 4 cores
      - name: Build the map
        run: |
          mkdir -p out/parts
          slug=$(echo "$ORIGIN" | tr 'A-Z' 'a-z')
          python3 build.py "only=$ORIGIN" "date=${{ needs.lookup.outputs.tue }}" "dates=${{ needs.lookup.outputs.dates }}" | tee "out/parts/build-$slug.log"

      # a real browser opens every journey on this map (FIX-14); pinned like the actions
      - name: Install a browser for the page check
        run: |
          # --with-deps also apt-installs extra fonts; if the Ubuntu mirrors can't be reached (DNS
          # failure on the runner, 11.11.2026) fall back to the browser alone - the runner image
          # already has every library Chromium needs, only optional fonts are missing then
          python3 -m playwright install --with-deps chromium || {
            echo "::warning::apt failed - installing Chromium without the extra system packages"
            python3 -m playwright install chromium
          }

      # The result goes into files for the publish job (a matrix job has no outputs of its own).
      # The job itself succeeds, so every map's result reaches the report.
      - name: Check this map
        run: |
          slug=$(echo "$ORIGIN" | tr 'A-Z' 'a-z')
          ok=true
          python3 tests/check_pages.py out/site > "out/parts/check-$slug.md" || ok=false
          # the in-browser router must find the same journeys as the build (IDEA-21); Node is on the runner
          { echo; echo '```'; node tests/check_router.mjs out; echo '```'; } >> "out/parts/check-$slug.md" || ok=false
          if [ "$ok" = "true" ]; then touch "out/parts/ok-$slug"; fi
          cat "out/parts/check-$slug.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the map to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-${{ strategy.job-index }}
          retention-days: 7
          if-no-files-found: error
          path: |
            out/site/
            out/parts/
            out/map.html
            out/routes*.md

  # The USA map (IDEA-25, D-67): download both operators' GTFS feeds, import them into data/us/,
  # build data/us -> out/site/us/, check it like the other maps. Runs beside the lookup.
  us:
    runs-on: ubuntu-latest
    timeout-minutes: 120           # five maps in one job; ~1 h before the search only took legs that can run (20.11.)
    name: map (USA)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml playwright==1.63.0

      - name: Next week's travel dates (Tue, Fri, Sat, Sun - as the lookup job)
        id: dates
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import datetime as d
          t = d.date.today()
          tue = t + d.timedelta(days=7 - t.weekday() + 1)
          print(f"tue={tue}")
          print("dates=" + ",".join(str(tue + d.timedelta(days=k)) for k in (0, 3, 4, 5)))
          PY

      # the feeds' own addresses (D-67); unzipped where gtfs_import.py looks (git-ignored)
      - name: Download the GTFS feeds
        run: |
          set -euo pipefail
          d=amtrak_source_data_for_git_to_ignore
          get() { curl -fsSL --retry 3 --retry-delay 20 --max-time 300 -o "$2" "$1"; }
          get https://content.amtrak.com/content/gtfs/GTFS.zip amtrak.zip
          get https://gtfs.gis.flix.tech/gtfs_generic_us.zip flix.zip || get http://gtfs.gis.flix.tech/gtfs_generic_us.zip flix.zip
          get https://www.viarail.ca/sites/all/files/gtfs/viarail.zip via.zip     # Open Government Licence - Canada
          for pair in "amtrak.zip GTFS" "flix.zip gtfs_generic_us" "via.zip viarail"; do
            set -- $pair
            mkdir -p "$d/$2"
            unzip -oq "$1" -d "$d/$2"
            f=$(find "$d/$2" -name stop_times.txt | head -1)          # files at the top, or in a folder of their own
            if [ -z "$f" ]; then echo "::error::no stop_times.txt in $1"; exit 1; fi
            if [ "$(dirname "$f")" != "$d/$2" ]; then mv "$(dirname "$f")"/* "$d/$2/"; fi
          done
          ls -la "$d"/*/feed_info.txt

      - name: Import the timetables into data/us/
        run: python3 gtfs_import.py --start "$(date +%F)" --days 120 | tee us-import.log

      - name: Build the map
        env:
          PYTHONUNBUFFERED: "1"          # show the progress in the log as it happens
        run: |
          mkdir -p out/us/parts
          python3 build.py network=us "date=${{ steps.dates.outputs.tue }}" "dates=${{ steps.dates.outputs.dates }}" | tee out/us/parts/build-usa.log

      - name: Install a browser for the page check
        run: |
          python3 -m playwright install --with-deps chromium || {
            echo "::warning::apt failed - installing Chromium without the extra system packages"
            python3 -m playwright install chromium
          }

      # as the other maps: every journey in a real browser, both routers, and no big drop since last week
      - name: Check this map
        run: |
          ok=true
          c=out/us/parts/check-usa.md
          python3 tests/check_pages.py out/site/us > "$c" || ok=false
          { echo; echo '```'; node tests/check_router.mjs out/us out/site/us; echo '```'; } >> "$c" || ok=false
          { echo; python3 check_build.py --summary out/us/summary.json | sed 's/^## Map update check/### USA: compared with last week/'; } >> "$c" || ok=false
          if [ "$ok" = "true" ]; then touch out/us/parts/ok-usa; fi
          cat "$c" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the map to the publish job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: us
          retention-days: 7
          if-no-files-found: warn
          path: |
            out/site/us/
            out/us/
            data/us/legs.yaml
            data/us/map_layers.json
            us-import.log

  publish:
    needs: [lookup, map, us]
    # also when a map job failed: the update is then held back and the issue says why
    if: always() && needs.lookup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write               # commit the timetable data
      issues: write                 # the weekly issues (D-38, D-49)
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data
          path: .

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: map-*
          merge-multiple: true
          path: out

      # the US map: out/site/us/, out/us/ and data/us/ (after the lookup's data/, so its data/us wins);
      # missing if that job failed - the check below then holds the update back
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: us
          path: .

      - name: Check before publishing
        id: check
        env:
          ORIGINS: ${{ needs.lookup.outputs.origins }}
        run: |
          ok=true
          python3 build.py --merge || ok=false
          if [ -f out/summary.json ]; then python3 check_build.py > check.md || ok=false
          else echo "## Map update check" > check.md; fi
          { echo; echo "## Page check"; } >> check.md
          for slug in $(python3 -c 'import json, os; print(" ".join(o.lower() for o in json.loads(os.environ["ORIGINS"])))'); do
            if [ -f "out/parts/check-$slug.md" ]; then
              { echo; grep -v '^## Page check' "out/parts/check-$slug.md"; } >> check.md
            else
              { echo; echo "- **$slug**: the map job failed – see the run log."; } >> check.md
            fi
            [ -f "out/parts/ok-$slug" ] || ok=false
          done
          # the US map (D-67); without it the site would lose its us/ pages, so it holds the update back too
          if [ -f out/us/parts/check-usa.md ]; then
            { echo; echo "### USA"; grep -v '^## Page check' out/us/parts/check-usa.md; } >> check.md
          else
            { echo; echo "- **USA**: the map job failed – see the run log."; } >> check.md
          fi
          [ -f out/us/parts/ok-usa ] || ok=false
          if [ "$ok" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.force }}" = "true" ] && [ -f out/summary.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "_Published anyway (force)._" >> check.md
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          cat check.md >> "$GITHUB_STEP_SUMMARY"
          { echo; echo "## Build"; echo '```'; cat out/parts/build-*.log out/us/parts/build-usa.log 2>/dev/null | grep -E "^From .*(main journeys|WARNING)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f us-import.log ]; then { echo; echo "## USA timetables"; echo '```'; cat us-import.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          { echo; echo "## Lookup"; echo '```'; sed -n '/^=====/,$p' lookup.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -f wiki.log ]; then { echo; echo "## City texts"; echo '```'; grep -E "^wikidata|failed|no article|^  " wiki.log | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit the new timetable data
        if: steps.check.outputs.ok == 'true'
        run: |
          git config user.name "maatapitkin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ out/summary.json out/routes*.md out/us/summary.json out/us/routes*.md
          git commit -m "Weekly update: trains for the week of ${{ needs.lookup.outputs.tue }}" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Prepare the web page
        if: steps.check.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/site

      # Only what needs a person (lines that lost their trains, impossibly fast legs, new places,
      # guessed names) - opened as an issue, so GitHub emails it. A quiet week sends nothing (D-38).
      # One issue per week: later runs add to it, older weeks' issues are closed (D-49).
      - name: Report lookup results that need attention
        if: always() && hashFiles('lookup.log') != ''
        continue-on-error: true   # issue bookkeeping must never stop the map from being published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 lookup_report.py lookup.log tidy.log > attention.md
          if [ -s attention.md ]; then
            {
              echo "Timetable lookup for the week of ${{ needs.lookup.outputs.tue }}. Map published: ${{ steps.check.outputs.ok == 'true' && 'yes' || 'no (see the held-back issue)' }}."
              echo
              cat attention.md
              echo
              echo "Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            } > issue.md
            { echo "## Needs attention"; echo; cat attention.md; } >> "$GITHUB_STEP_SUMMARY"
            python3 .github/weekly_issue.py report "Check the timetable lookup" "${{ needs.lookup.outputs.tue }}" issue.md
          else
            echo "Nothing needs attention." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report a held-back update
        if: steps.check.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/weekly_issue.py report "Map update held back" "${{ needs.lookup.outputs.tue }}" check.md

      - name: Close held-back issues once a map is published
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true   # issue bookkeeping must never stop the map from being published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/weekly_issue.py close "Map update held back" "A later run published the map: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy:
    needs: publish
    if: always() && needs.publish.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
