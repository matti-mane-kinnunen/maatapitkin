# City texts from Wikivoyage / Wikipedia (IDEA-22), by hand for now (Actions → Fetch city texts →
# Run workflow, pick the branch). Writes data/wiki/<lang>.yaml and commits it to that branch.
# Later: a step in the weekly run instead.
name: Fetch city texts

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Places, comma-separated (English names in places.yaml; empty = all with a wd:)"
        type: string
        default: "Lisbon"

permissions:
  contents: write          # commit data/wiki; nothing else

concurrency:
  group: fetch-wiki
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Test the text handling
        run: python3 -m unittest tests.test_wiki -v

      # the input goes in through an environment variable, never pasted into the command (D-47);
      # fetch_wiki.py refuses names that are not in places.yaml
      - name: Fetch the texts
        env:
          ONLY: ${{ inputs.only }}
        run: python3 fetch_wiki.py --only "$ONLY" | tee fetch.log

      - name: Commit data/wiki
        run: |
          { echo '## City texts'; echo '```'; cat fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "maatapitkin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiki
          git commit -m "City texts (IDEA-22): ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git pull --rebase
          git push
