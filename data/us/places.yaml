# USA network (IDEA-25, D-67). Places: coordinates (Amtrak station from Amtrak's GTFS, feed 20261118, via
# ~/Code/amtrak-experiments/output/amtrak_stations.csv; else set by hand), time zone (tz:, D-63),
# capital flag and note, and amtrak: the GTFS stop codes gtfs_import.py maps to this place.
# flix: Flix/Greyhound GTFS stop_ids (gtfs_generic_us, 2026-11-15) for capitals served by bus.
settings:
  origin: Chicago
  origins:                   # one map page per origin
    Chicago: {page: index.html, lang: en, title: Train trip, start_time: "06:00", start_times: ["06:00", "13:00"]}  # TO DECIDE: the western long-distance trains leave Chicago in the afternoon
  start_time: "06:00"
  start_times: ["06:00", "13:00"]
  min_transfer: 20           # minutes, train -> train  (TO DECIDE: Amtrak connections usually need more)
  night_point: "01:00"       # a wait that includes this time is an overnight (hotel) stay
  morning_departure: "06:00" # earliest departure after a hotel night
  min_hotel_stay: "8:00"
  quiet_hours: "00:00-05:00"
  max_stay_nights: 6         # a week covers the less-than-daily trains (Cardinal, Sunset Limited)
  alternative_max_extra_hours: 12
  start_date: 2026-12-08     # travel date; default is next Monday (or use --date)
  repo_url: "https://github.com/matti-mane-kinnunen/maatapitkin"
  co2:                       # D-67: diesel trains outside the electrified NEC / Keystone (not wired into co2.py yet)
    source: "Klimatsmart semester (Chalmers), Jörgen Larsson, method report v5.1, factors for 2026"
    source_url: "https://klimatsmartsemester.se/sa-har-vi-raknat"
    factors:                 # kg CO2e per person-km
      rail: 0.019            # electric train (Northeast Corridor, Keystone)
      rail_diesel: 0.096     # diesel train (D-67)
      coach: 0.030
      ferry: 0.186
      flight: 0.117
    route_factor: 1.2
    flight_uplift: 1.0

