  section: Fakta om Lissabon
  source: wikivoyage
  text: Lissabon är Portugals huvudstad. Det är en gammal historisk stad med hamn mot Atlanten. Lissabon är en storstad
    med allt det erbjuder. Staden är känd för sin gamla stad med vit- och gul-putsade fasader och sin speciella
    sorgesamt längtande Fado-musik som spelas på restauranger inne i staden. Det är även nära till Atlantkustens
    stränder.
