  text: Zagabria è la capitale della Croazia. Zagabria è situata nel nord-ovest della Croazia, ai limiti sud occidentali
    del bacino della Pannonia e a 170 km dal mar Adriatico. La città si estende tra la riva settentrionale del fiume
    Sava e il massiccio Medvednica che raggiunge i 1.034 m. con il Monte Sljeme. La temperatura media estiva è di
    20 °C, mentre quella invernale si aggira su 1 °C.
  title: Zagabria
  url: https://it.wikivoyage.org/wiki/Zagabria
