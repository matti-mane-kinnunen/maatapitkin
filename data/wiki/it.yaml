  source: wikivoyage
  text: Zurigo (in tedesco Zürich) è la città più grande della Svizzera, con una popolazione di circa 400.000 persone
    in città e 1,3 milioni nella zona metropolitana. Zurigo si trova sul lago di Zurigo, dove il lago si incontra
    con il fiume Limmat, nel nord della Svizzera. Contrariamente a ciò che alcuni credono, Zurigo non è la capitale
    della Svizzera - questo onore cade a Berna.
  title: Zurigo
  url: https://it.wikivoyage.org/wiki/Zurigo
