  text: Die bunte Metropole Lissabon ist die Hauptstadt und größte Stadt Portugals. Nicht nur in ihrer Architektur,
    auch in ihrer Kultur und in ihren Menschen spiegelt sich die Vielfalt ihrer Geschichte wider. Nahezu die Hälfte
    aller Ausländer Portugals ist hier zu Hause. Im alten Lissabon ist das maurische Erbe spürbar, die jüngere Geschichte
    brachte afrikanische und südamerikanische Einflüsse.
