  text: Östersund er et byområde i Jämtland, Sverige. Den er residensby i Jämtlands län samt hovedby i Östersunds
    kommune. Byen ligger ved Storsjön, og er Storsjöbygdens og Jämtlands eneste købstad. Östersund er det 24.-største
    byområde i Sverige, med 43.796 indbyggere. Östersund er den eneste købstad, der blev grundlagt i 1700-tallet
    i det nuværende Sverige.
