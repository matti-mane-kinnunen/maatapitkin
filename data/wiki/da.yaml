  text: Zürich er den største by i Schweiz med sine 440.935 indbyggere. Byen er hovedstad i kanton Zürich, og ligger
    i naturskønne omgivelser ved Zürichsøen og gennemstrømmes af floden Limmat. Byens lufthavn, Zürich Lufthavn,
    er beliggende 13 km nord for byen, og ekspederede 24.802.466 passagerer i 2012. Byen har universitet, teknisk
    universitet, finanscentrum og tekstil-, maskin- og grafisk industri.
