  text: Zagreb er hovedstad og den største by i Kroatien. Zagreb er det kulturelle, videnskabelige, økonomiske og
    administrative centrum for landet. Byen har 767.131 indbyggere og hele storbyområdet har 1.189.279, 1.161.259,
    1.218.792 indbyggere med forstæder. Byen ligger mellem de sydlige skråninger af Medvednica-bjergene og på begge
    bredder af Savafloden i en højde af omtrent 122 m over havets overflade.
