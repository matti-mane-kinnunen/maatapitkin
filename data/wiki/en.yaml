  source: wikivoyage
  text: Tarifa is a small town in the Province of Cádiz in Andalusia. It's the southernmost point of mainland Europe
    and the closest to Africa, just 14 km away across the Strait of Gibraltar. That line between continents is taken
    as the divide between the Atlantic Ocean and the Mediterranean Sea. Strong winds funnel through the Strait and
