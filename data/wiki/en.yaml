    called "the city of sunshine", for its brilliant weather. It is known for the imposing cathedral, a wealth of
    Art Nouveau and historicist buildings, and for the fish soup Halászlé.
  title: Szeged
  url: https://en.wikivoyage.org/wiki/Szeged
