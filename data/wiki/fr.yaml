  text: Łódź, souvent orthographiée sans signes diacritiques Lodz en français, est par sa population la quatrième
    ville de Pologne et le chef-lieu du powiat de Łódź-est et de la voïvodie de Łódź. Son histoire est celle d'un
    petit village à l'écart des voies de communication devenu en moins d'un siècle un grand centre industriel et
    la deuxième ville de Pologne.
  title: Łódź
