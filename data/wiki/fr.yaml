  text: Östersund (en suédois ) est une ville de Suède, chef-lieu de la commune d'Östersund dans le comté de Jämtland
    (une petite partie de la ville est située sur le territoire de la commune de Krokom). Elle est peuplée de 59
    485 habitants (31 décembre 2012) ce qui en fait, de loin, la localité la plus peuplée de tout le centre-ouest
    suédois.
  title: Östersund
  url: https://fr.wikipedia.org/wiki/%C3%96stersund
