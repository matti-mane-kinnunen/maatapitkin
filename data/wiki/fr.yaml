  text: Zurich est une ville de Suisse, capitale du canton de Zurich. Même si l'allemand y est la langue officielle
    et le zurichois (Züritüütsch) le dialecte le plus parlé, leur usage à la maison est en constante diminution
    de 2010 à 2024, alors que le français, l'espagnol et surtout l'anglais (avec une augmentation de 72%) ont connu
    une tendance inverse.
  title: Zurich
  url: https://fr.wikipedia.org/wiki/Zurich
