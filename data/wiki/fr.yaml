  text: Lisbonne est la capitale et la plus grande ville du Portugal. Lisbonne est la capitale la plus occidentale
    d'Europe continentale. Elle est située sur une berge de la mer de paille. Le centre historique de la ville est
    composé de sept collines, dont certaines ont des rues trop pentues pour permettre la circulation automobile.
