# Page texts, English (the master). Other languages: data/i18n/<lang>.yaml with the same keys;
# a missing key falls back to English (IDEA-13). {name} is filled in by the page or the build;
# {one: …, other: …} picks the form by the number n. Texts may contain simple HTML.
