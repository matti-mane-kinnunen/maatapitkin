# Nearby places (IDEA-24): towns a short hop from a place on the map, shown in its itinerary, its
# tooltip and the search - but not routed and not drawn, so the map stays readable (D-64).
#
#   Hub:                          a key in places.yaml
#     - {name: Pisa, by: train, time: "1:00", every: 30}
#
#   by      train | bus | ferry
#   time    typical journey, H:MM
#   every   minutes between departures (about), or  daily: N  for N a day
#   aliases other names for the search (local spellings)
#
# Times are approximate (Claude, Nov 2026, from general knowledge) - check them with the
# operator once a year (DATA-12), like the other own times. Names in other languages: names.yaml.

