# Journey legs — the single source of truth.
# Converted from MaataPitkin v1.9 (.dot, 25.4.2023). Times are local clock times;
# an arrival earlier than the departure means the next day (or later if `days` is set).
#
# Fields
#   from, to      place ids (see places.yaml)
#   dep, arr      "HH:MM" local time. Omit both for untimed legs and give `duration` instead.
#   times         many departures in one entry: ["06:00-06:39", "06:20-06:59", ...]
#   every         or a pattern: every: 20, first: "06:00", last: "22:40", duration: "0:39"
#   source        transitous (looked up by add_leg.py) or manual
#   duration      "H:MM" for untimed / frequent legs (subway, ferries with unknown times)
#   service       train number / operator as shown on the graph
#   mode          train | ferry | bus | local
#   night         true for night trains / night ferries (drawn turquoise)
#   highlight     tag for a route drawn in its own colour (e.g. sto-ham-night = orange)
#   runs          weekdays the leg runs: daily (default), mon-fri, "fri,sun", tue-thu,sat ...
#   valid_from/valid_to  timetable period (YYYY-MM-DD); outside it the leg is not used
#   checked       date the timetable was last verified
#   note          free text; shown on the graph
#   issue         known data problem — printed by the build as a warning

