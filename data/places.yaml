# Places: coordinates (main station / port, approx.), capital flag and minimum
# connection time in minutes at that place (default from settings).
settings:
  origin: Helsinki
  origins:                   # one map page per origin (IDEA-04); the first is index.html; lang = place names (data/names.yaml)
    Helsinki: {page: index.html, lang: fi, from: Helsingistä}   # from = 'from Helsinki' in the map's language (Finnish cases, IDEA-13)
    Stockholm: {page: stockholm.html, lang: sv, title: Tågsemester, start_time: "16:00", start_times: ["06:00", "16:00"]}  # ferries east and night trains south leave 16:30-18:00
    Copenhagen: {page: copenhagen.html, lang: da, title: Togferie, start_time: "06:00", start_times: ["06:00", "16:00"]}  # day trains from early morning; evening for night trains
    London: {page: london.html, lang: en, title: Train holiday, start_time: "06:00", start_times: ["06:00", "17:00"]}  # Eurostar from early morning; evening for the sleepers
    Berlin: {page: berlin.html, lang: de, title: Zugurlaub, start_time: "06:00", start_times: ["06:00", "17:00"]}  # day ICEs from early morning; evening for night trains
  start_time: "17:00"        # leave Helsinki from this time on day 1 (17:00 = the evening train)
  start_times: ["05:00", "17:00"]  # morning / evening switch on the map; 05:00 catches IC 941 05:26 to the Turku day ferry (IDEA-02)
  min_transfer: 20           # minutes, train -> train
  ferry_checkin: 45          # minutes before a ferry departs (check-in and getting from the station to the port)
  eurostar_checkin: 60       # minutes before Eurostar (service starting EST/ES); passport control is unpredictable
  night_point: "01:00"       # a wait that includes this time is an overnight (hotel) stay
  morning_departure: "06:00" # earliest departure after a hotel night (a place may have its own: Budapest 05:00)
  min_hotel_stay: "8:00"     # and at least this long after arriving: arrive 01:00, leave 09:00 at the earliest (FIX-07)
  quiet_hours: "00:00-05:00" # only night trains and night ferries run then; a wait touching them is a hotel night
  max_stay_nights: 6         # never wait longer than this at one place: a week covers weekly services (Andorra sleeper, D-42)
  alternative_max_extra_hours: 12  # show "fewest changes / hotel nights" only if at most this much slower
  start_date: 2026-12-08   # travel date; default is next Monday (or use --date)
  site_url: "https://matti-mane-kinnunen.github.io/maatapitkin/"  # for link previews (Open Graph, IDEA-11)
  co2:                       # rough CO2 per journey vs a direct flight (IDEA-07, D-41, D-51); remove to switch off
    source: "Klimatsmart semester (Chalmers), Jörgen Larsson, method report v5.1, factors for 2026"
    source_url: "https://klimatsmartsemester.se/sa-har-vi-raknat"
    factors:                 # kg CO2e per person-km (their table 1, g / 1000)
      rail: 0.019            # electric train, European electricity mix
      rail_nordic: 0.004     # electric train in Finland, Sweden and Norway (Nordic electricity mix)
      coach: 0.030           # diesel coach (29-32 in their report)
      ferry: 0.186           # ferry, standard value (emissions shared between passengers and freight by revenue)
      flight: 0.117          # scheduled flight, economy, standard jet fuel, incl. high-altitude effects (x1.5) and fuel production
    nordic_countries: [FI, SE, NO]
    route_factor: 1.2        # tracks, roads and sea routes are about 20 % longer than the straight line
    flight_uplift: 1.0       # none: their flight factor is per straight-line (great-circle) km

