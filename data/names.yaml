# Place names as shown on each map (D-50). The keys are the names used everywhere else
# (pairs.txt, legs.yaml, places.yaml, links); only the display changes.
# Each map has a language (settings.origins.<city>.lang). For a place, the map shows its
# name in that language, else `all` (the right spelling for every map), else the key.
# Only list what differs from the key. Local names also work in pairs.txt and in the search.
#   fi Finnish (Helsinki) · sv Swedish (Stockholm) · da Danish (Copenhagen)
#   de German (Berlin) · en English (London) · fr French (Paris) · it Italian (Rome)

